name: Runtime Bundle Check

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  bundle-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build runtime bundle
        run: node tools/build-runtime-bundle.mjs

      - name: Verify bundle output exists
        run: test -f src/runtime/runtime.bundle.js
