name: Build Extension CRX

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for new commits
        id: commit_check
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "No release tag found; continuing."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS_SINCE_TAG=$(git rev-list --count "$LATEST_TAG..HEAD")

          if [ "$COMMITS_SINCE_TAG" -eq 0 ]; then
            echo "No new commits since $LATEST_TAG; skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found $COMMITS_SINCE_TAG commit(s) since $LATEST_TAG; continuing build."
          echo "should_build=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' || steps.commit_check.outputs.should_build == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Yarn via Corepack
        if: github.event_name == 'workflow_dispatch' || steps.commit_check.outputs.should_build == 'true'
        run: |
          corepack enable
          yarn --version

      - name: Install Chrome (if missing)
        if: github.event_name == 'workflow_dispatch' || steps.commit_check.outputs.should_build == 'true'
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "google-chrome already available"
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Build extension artifacts
        if: github.event_name == 'workflow_dispatch' || steps.commit_check.outputs.should_build == 'true'
        env:
          CRX_PRIVATE_KEY: ${{ secrets.PEM }}
        run: bash build.sh

      - name: Verify build artifacts
        if: github.event_name == 'workflow_dispatch' || steps.commit_check.outputs.should_build == 'true'
        run: |
          test -f dist/manga-scaler.zip
          test -f dist/manga-scaler.crx

      - name: Generate release notes
        if: github.event_name == 'workflow_dispatch' || steps.commit_check.outputs.should_build == 'true'
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges)
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: (github.event_name == 'workflow_dispatch' || steps.commit_check.outputs.should_build == 'true') && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          files: |
            dist/manga-scaler.zip
            dist/manga-scaler.crx
          body: |
            Build #${{ github.run_number }}

            ${{ steps.release_notes.outputs.commits }}
          draft: false
          prerelease: false
