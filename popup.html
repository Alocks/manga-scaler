<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg: #13151a;
      --panel: #1d2129;
      --text: #f2f5fb;
      --muted: #a4adbc;
      --accent: #ff7f32;
      --accent-2: #59c5ff;
      --border: #2c313d;
    }
    body {
      width: 280px;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% -10%, #2a3140 0, var(--bg) 45%);
      color: var(--text);
    }
    
    .popup-container {
      padding: 16px;
    }
    
    .title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .preset-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .preset-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .preset-option:hover {
      background: #e8e8e8;
    }

    .preset-option.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .preset-option.disabled:hover {
      background: transparent;
    }
    
    .preset-option input[type="radio"] {
      margin: 0;
      cursor: pointer;
    }
    
    .preset-label {
      flex: 1;
      cursor: pointer;
      font-size: 13px;
    }
    
    .field-row {
      margin-top: 10px;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .field-select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d8d8d8;
      border-radius: 4px;
      background: #fff;
      color: #333;
      font-size: 12px;
    }

    .onnx-model-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .onnx-model-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .onnx-model-desc {
      margin-left: 28px;
      font-size: 10px;
      color: #666;
      line-height: 1.3;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      margin: 14px 0 8px;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .tab-strip {
      display: flex;
      gap: 6px;
      margin-bottom: 4px;
    }

    .tab-pill {
      flex: 1;
      text-align: center;
      font-size: 11px;
      padding: 6px 4px;
      border-radius: 999px;
      background: #e8e8e8;
      color: #555;
      border: 1px solid #ddd;
      cursor: pointer;
      user-select: none;
    }

    .tab-pill.active {
      background: #4CAF50;
      color: #fff;
      border-color: #4CAF50;
      font-weight: 600;
    }

    .tab-pill.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .engine-panel {
      display: none;
    }

    .engine-panel.active {
      display: block;
    }

    .shader-backend-panel {
      display: none;
      margin-top: 10px;
    }

    .shader-backend-panel.active {
      display: block;
    }

    .panel-note {
      font-size: 11px;
      color: #666;
      padding: 8px;
      background: #fff;
      border: 1px solid #e2e2e2;
      border-radius: 4px;
    }
    
    .cache-actions {
      margin-top: 4px;
      padding: 10px 1px 1px;
      border-top: 1px solid #ddd;
    }

    .action-button {
      width: 90%;
      border: 1px solid #d64545;
      background: #fff;
      color: #b42323;
      border-radius: 4px;
      padding: 7px 1px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      display: block;
      margin: 0 auto;
    }

    .action-button:hover {
      background: #fff1f1;
    }

    .action-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .action-status {
      margin-top: 8px;
      font-size: 11px;
      color: #666;
    }

    .action-status:empty {
      display: none;
    }

    .action-status.error {
      color: #b42323;
    }

    .action-status.success {
      color: #1f7a1f;
    }

  </style>
</head>
<body>
  <div class="popup-container">
    <div class="title">
      <span>manga-scaler</span>
    </div>
    <div class="tab-strip" id="engineTabs">
      <div class="tab-pill" data-tab="off">OFF</div>
      <div class="tab-pill" data-tab="shaders">Shaders</div>
      <div class="tab-pill" data-tab="onnx">ONNX</div>
    </div>


    <div id="enginePanel-off" class="engine-panel">
    </div>

    <div id="enginePanel-shaders" class="engine-panel">
      <div class="field-row">
        <label class="field-label" for="shaderBackend">Shader Backend</label>
        <select id="shaderBackend" class="field-select" name="shaderBackend">
          <option value="webgl">Anime4K[WebGL]</option>
          <option value="webgpu">Anime4K[WebGPU]</option>
        </select>
      </div>

      <div id="shaderBackendPanel-webgl" class="shader-backend-panel">
        <div class="preset-options">
          <label class="preset-option">
            <input type="radio" name="preset" value="S">
            <span class="preset-label">Fast</span>
          </label>

          <label class="preset-option">
            <input type="radio" name="preset" value="M">
            <span class="preset-label">Balanced</span>
          </label>

          <label class="preset-option">
            <input type="radio" name="preset" value="L">
            <span class="preset-label">Quality</span>
          </label>

          <label class="preset-option">
            <input type="radio" name="preset" value="VL">
            <span class="preset-label">High Quality</span>
          </label>

          <label class="preset-option">
            <input type="radio" name="preset" value="UL">
            <span class="preset-label">Best Quality</span>
          </label>
        </div>
      </div>

      <div id="shaderBackendPanel-webgpu" class="shader-backend-panel">
        <div class="preset-options">
          <label class="preset-option">
            <input type="radio" name="webgpuModel" value="ModeA">
            <span class="preset-label">Fast Sharp</span>
          </label>
          <label class="preset-option">
            <input type="radio" name="webgpuModel" value="ModeAA">
            <span class="preset-label">Quality Sharp</span>
          </label>
          <label class="preset-option">
            <input type="radio" name="webgpuModel" value="ModeB">
            <span class="preset-label">Fast Clean</span>
          </label>
          <label class="preset-option">
            <input type="radio" name="webgpuModel" value="ModeBB">
            <span class="preset-label">Quality Clean</span>
          </label>
          <label class="preset-option">
            <input type="radio" name="webgpuModel" value="ModeC">
            <span class="preset-label">Fast Denoise</span>
          </label>
          <label class="preset-option">
            <input type="radio" name="webgpuModel" value="ModeCA">
            <span class="preset-label">Quality Denoise</span>
          </label>
        </div>
        <div class="field-row">
          <label class="field-label" for="webgpuScale">Scale</label>
          <select id="webgpuScale" class="field-select" name="webgpuScale">
            <option value="2">2x</option>
            <option value="3">3x</option>
            <option value="4">4x</option>
          </select>
        </div>
      </div>
    </div>

    <div id="enginePanel-onnx" class="engine-panel">
      <div class="field-row">
        <label class="field-label">Choose Model</label>
        <div id="onnxModelList" class="onnx-model-list"></div>
      </div>
    </div>
    <div class="cache-actions">
      <button id="clearCacheButton" class="action-button" type="button">Clear Cached Images</button>
      <div id="cacheActionStatus" class="action-status"></div>
    </div>
  </div>
  
  
  <script src="src/runtime/engines/onnx-models.js"></script>
  <script src="popup.js"></script>
</body>
</html>
